<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a8efb">
    <meta name="description" content="Business card web-page of Volodymyr Balashov">
    <link rel="stylesheet" href="./css/reset.css"/>
    <link rel="stylesheet" href="./css/style.css"/>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <title>Volod.Balashov</title>
</head>

<body>
<main>
    <div class="intro">
        <div class="container">
            <div class="intro__inner">
                <div class="intro__content">
                    <h1 class="intro__title">Volodymyr Balashov</h1>
                    <h2 class="intro__role">Software Engineer</h2>
                    <h3 class="intro__subtitle">I build for fun. I build to solve.</h3>
                    <div class="intro__links">
                        <a href="https://github.com/volod-one" class="intro__link" target="_blank"
                           rel="noopener" aria-label="GitHub">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                 fill="currentColor" width="24" height="24">
                                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                            </svg>
                        </a>
                        <a href="https://www.linkedin.com/in/volodbalashov/" class="intro__link"
                           target="_blank" rel="noopener" aria-label="LinkedIn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                 fill="currentColor" width="24" height="24">
                                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                            </svg>
                        </a>
                    </div>
                </div>

                <picture class="intro__avatar">
                    <img src="./image/avatar.jpg" alt="avatar">
                </picture>
            </div>
        </div>
    </div>
    <section class="contact">
        <div class="container">
            <div class="contact__body">
                <div class="contact__info">
                    <h2 class="contact__title">Let's talk</h2>
                    <p class="contact__text">Have a question or just want to say hi? I'd love to
                        hear from you.</p>
                    <a href="mailto:contact@volod.one" class="contact__email">contact@volod.one</a>
                </div>
                <div class="contact__divider"><span>or</span></div>
                <form class="contact__form" id="contactForm" novalidate>
                    <input type="hidden" name="access_key"
                           value="6c34364d-ba85-48d1-a176-7bc06b257da8">
                    <label>
                        <input type="text" name="_honey" style="display:none" tabindex="-1"
                               autocomplete="off">
                    </label>
                    <div class="contact__field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>
                    <div class="contact__field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com"
                               required>
                    </div>
                    <div class="contact__field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="What's on your mind?"
                                  rows="5" required></textarea>
                    </div>
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEZnnqTV4dXTkS_h"
                         data-action="contact"></div>
                    <button type="submit" class="contact__submit">Send</button>
                </form>
            </div>
        </div>
    </section>
</main>
<script src="./js/main.js" defer></script>
</body>

</html>
